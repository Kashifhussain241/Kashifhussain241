<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="24" viewBox="0 0 1000 24" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8ec5fc" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#c471f5"/>
      <stop offset="1" stop-color="#fa71cd" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>
  <rect x="0" y="11" width="1000" height="2" rx="1" fill="url(#g)"/>
  <circle cy="12" r="6" fill="#c471f5" filter="url(#glow)">
    <animate attributeName="cx" values="0;1000" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cy="12" r="2.5" fill="#c471f5">
    <animate attributeName="cx" values="0;1000" dur="4s" repeatCount="indefinite"/>
  </circle>
</svg>
