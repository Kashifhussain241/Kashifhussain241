<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="400" viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">Kashif Hussain, Full-Stack Developer</title>
  <desc id="d">A code-style card listing name, role, education, technology stack and availability.</desc>

  <rect width="1000" height="400" rx="20" fill="#FFFFFF"/>

  <!-- card -->
  <rect x="40" y="30" width="920" height="340" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- title bar -->
  <circle cx="72" cy="60" r="6" fill="#CBD5E1"/>
  <circle cx="92" cy="60" r="6" fill="#CBD5E1"/>
  <circle cx="112" cy="60" r="6" fill="#CBD5E1"/>
  <text x="500" y="65" text-anchor="middle" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="14" fill="#64748B">about.js</text>
  <line x1="40" y1="84" x2="960" y2="84" stroke="#E2E8F0"/>

  <!-- accent bar -->
  <rect x="40" y="84" width="4" height="286" fill="#2563EB" opacity="0.9"/>

  <g font-family="Consolas, Menlo, 'Courier New', monospace" font-size="19">
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.4s" fill="freeze"/>
      <text x="80" y="124"><tspan fill="#2563EB">const</tspan> <tspan fill="#0F172A" font-weight="bold">developer</tspan> <tspan fill="#0F172A">= {</tspan></text></g>

    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.7s" dur="0.4s" fill="freeze"/>
      <text x="115" y="151"><tspan fill="#64748B">name</tspan><tspan fill="#0F172A">: </tspan><tspan fill="#0F172A">"Kashif Hussain"</tspan><tspan fill="#0F172A">,</tspan></text></g>

    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.1s" dur="0.4s" fill="freeze"/>
      <text x="115" y="178"><tspan fill="#64748B">role</tspan><tspan fill="#0F172A">: </tspan><tspan fill="#0F172A">"Full-Stack Developer"</tspan><tspan fill="#0F172A">,</tspan></text></g>

    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.5s" dur="0.4s" fill="freeze"/>
      <text x="115" y="205"><tspan fill="#64748B">education</tspan><tspan fill="#0F172A">: </tspan><tspan fill="#0F172A">"BS Software Engineering"</tspan><tspan fill="#0F172A">,</tspan></text></g>

    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.9s" dur="0.4s" fill="freeze"/>
      <text x="115" y="232"><tspan fill="#64748B">frontend</tspan><tspan fill="#0F172A">: [</tspan><tspan fill="#2563EB">"HTML"</tspan><tspan fill="#0F172A">, </tspan><tspan fill="#2563EB">"CSS"</tspan><tspan fill="#0F172A">, </tspan><tspan fill="#2563EB">"JavaScript"</tspan><tspan fill="#0F172A">, </tspan><tspan fill="#2563EB">"React"</tspan><tspan fill="#0F172A">],</tspan></text></g>

    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.3s" dur="0.4s" fill="freeze"/>
      <text x="115" y="259"><tspan fill="#64748B">backend</tspan><tspan fill="#0F172A">: [</tspan><tspan fill="#2563EB">"C#"</tspan><tspan fill="#0F172A">, </tspan><tspan fill="#2563EB">"ASP.NET Core"</tspan><tspan fill="#0F172A">, </tspan><tspan fill="#2563EB">"Node.js"</tspan><tspan fill="#0F172A">, </tspan><tspan fill="#2563EB">"Python"</tspan><tspan fill="#0F172A">],</tspan></text></g>

    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.7s" dur="0.4s" fill="freeze"/>
      <text x="115" y="286"><tspan fill="#64748B">database</tspan><tspan fill="#0F172A">: [</tspan><tspan fill="#2563EB">"SQL Server"</tspan><tspan fill="#0F172A">, </tspan><tspan fill="#2563EB">"MySQL"</tspan><tspan fill="#0F172A">],</tspan></text></g>

    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.1s" dur="0.4s" fill="freeze"/>
      <text x="115" y="313"><tspan fill="#64748B">openToWork</tspan><tspan fill="#0F172A">: </tspan><tspan fill="#2563EB" font-weight="bold">true</tspan></text></g>

    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.5s" dur="0.4s" fill="freeze"/>
      <text x="80" y="340"><tspan fill="#0F172A">};</tspan></text></g>

    <rect x="106" y="324" width="9" height="20" fill="#2563EB" opacity="0">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" begin="3.9s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
