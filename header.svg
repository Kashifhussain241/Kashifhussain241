<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="300" viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0c29"/>
      <stop offset="0.55" stop-color="#302b63"/>
      <stop offset="1" stop-color="#24243e"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#8ec5fc"/>
      <stop offset="0.5" stop-color="#c471f5"/>
      <stop offset="1" stop-color="#fa71cd"/>
      <animate attributeName="x1" values="0;-1;0" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;0;1" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="38"/>
    </filter>
    <clipPath id="card">
      <rect x="50" y="45" width="900" height="210" rx="30"/>
    </clipPath>
  </defs>

  <!-- background -->
  <rect width="1000" height="300" rx="24" fill="url(#bg)"/>

  <!-- floating color orbs -->
  <g filter="url(#blur)" opacity="0.9">
    <circle cx="180" cy="90" r="85" fill="#7f5af0">
      <animate attributeName="cx" values="180;300;180" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="90;190;90" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="820" cy="210" r="95" fill="#2cb1ff">
      <animate attributeName="cx" values="820;700;820" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="210;110;210" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="560" cy="60" r="70" fill="#ff6ac1">
      <animate attributeName="cx" values="560;650;560" dur="13s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="60;240;60" dur="13s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- glass card -->
  <g clip-path="url(#card)">
    <rect x="50" y="45" width="900" height="210" rx="30" fill="#ffffff" fill-opacity="0.07"/>
    <rect x="50" y="45" width="900" height="105" fill="url(#shine)"/>
    <rect x="-300" y="45" width="140" height="210" fill="#ffffff" fill-opacity="0.08" transform="skewX(-20)">
      <animate attributeName="x" values="-300;1200" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="50" y="45" width="900" height="210" rx="30" fill="none" stroke="url(#edge)" stroke-width="1.5"/>

  <!-- sparkles -->
  <g fill="#ffffff">
    <circle cx="110" cy="75" r="2" opacity="0"><animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="890" cy="95" r="2.5" opacity="0"><animate attributeName="opacity" values="0;1;0" dur="4s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="240" cy="230" r="1.8" opacity="0"><animate attributeName="opacity" values="0;1;0" dur="3.5s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="70" r="1.8" opacity="0"><animate attributeName="opacity" values="0;1;0" dur="2.8s" begin="1.7s" repeatCount="indefinite"/></circle>
    <circle cx="920" cy="225" r="2" opacity="0"><animate attributeName="opacity" values="0;1;0" dur="3.2s" begin="2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- text -->
  <g text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="5s" repeatCount="indefinite"/>
    <text x="500" y="145" font-size="62" font-weight="700" fill="url(#title)" opacity="0">Kashif Hussain
      <animate attributeName="opacity" from="0" to="1" dur="1.4s" fill="freeze"/>
    </text>
    <text x="500" y="188" font-size="19" fill="#dcdcff" letter-spacing="4" opacity="0">WEB DEVELOPER  •  SOFTWARE ENGINEERING STUDENT
      <animate attributeName="opacity" from="0" to="0.9" begin="0.8s" dur="1.2s" fill="freeze"/>
    </text>
    <text x="500" y="224" font-size="15" fill="#b8b8e6" letter-spacing="2" opacity="0">HTML  •  CSS  •  JavaScript  •  Node.js  •  Python  •  C#
      <animate attributeName="opacity" from="0" to="0.85" begin="1.4s" dur="1.2s" fill="freeze"/>
    </text>
  </g>
</svg>
