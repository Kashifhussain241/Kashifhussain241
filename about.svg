<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="380" viewBox="0 0 1000 380" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0c29"/>
      <stop offset="0.55" stop-color="#302b63"/>
      <stop offset="1" stop-color="#24243e"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="36"/>
    </filter>
    <clipPath id="card">
      <rect x="40" y="30" width="920" height="320" rx="26"/>
    </clipPath>
  </defs>

  <rect width="1000" height="380" rx="24" fill="url(#bg)"/>

  <g filter="url(#blur)" opacity="0.85">
    <circle cx="150" cy="300" r="80" fill="#7f5af0">
      <animate attributeName="cx" values="150;280;150" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="300;160;300" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="860" cy="80" r="85" fill="#2cb1ff">
      <animate attributeName="cx" values="860;720;860" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="80;250;80" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="520" cy="340" r="60" fill="#ff6ac1">
      <animate attributeName="cx" values="520;640;520" dur="14s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g clip-path="url(#card)">
    <rect x="40" y="30" width="920" height="320" rx="26" fill="#ffffff" fill-opacity="0.07"/>
    <rect x="40" y="30" width="920" height="120" fill="url(#shine)"/>
    <rect x="-300" y="30" width="120" height="320" fill="#ffffff" fill-opacity="0.07" transform="skewX(-20)">
      <animate attributeName="x" values="-300;1200" dur="8s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="40" y="30" width="920" height="320" rx="26" fill="none" stroke="url(#edge)" stroke-width="1.5"/>

  <!-- window dots -->
  <circle cx="75" cy="62" r="7" fill="#ff5f57"/>
  <circle cx="97" cy="62" r="7" fill="#febc2e"/>
  <circle cx="119" cy="62" r="7" fill="#28c840"/>
  <text x="500" y="67" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="14" fill="#a9a9d6">about.js</text>
  <line x1="40" y1="86" x2="960" y2="86" stroke="#ffffff" stroke-opacity="0.12"/>

  <!-- code -->
  <g font-family="Consolas, Menlo, 'Courier New', monospace" font-size="19">
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.4s" dur="0.4s" fill="freeze"/>
      <text x="80" y="122"><tspan fill="#c792ea">const</tspan> <tspan fill="#82aaff">developer</tspan> <tspan fill="#d6deeb">= {</tspan></text></g>
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.9s" dur="0.4s" fill="freeze"/>
      <text x="115" y="150"><tspan fill="#7fdbca">name</tspan><tspan fill="#d6deeb">: </tspan><tspan fill="#c3e88d">"Kashif Hussain"</tspan><tspan fill="#d6deeb">,</tspan></text></g>
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.4s" dur="0.4s" fill="freeze"/>
      <text x="115" y="178"><tspan fill="#7fdbca">role</tspan><tspan fill="#d6deeb">: </tspan><tspan fill="#c3e88d">"Web Developer"</tspan><tspan fill="#d6deeb">,</tspan></text></g>
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.9s" dur="0.4s" fill="freeze"/>
      <text x="115" y="206"><tspan fill="#7fdbca">study</tspan><tspan fill="#d6deeb">: </tspan><tspan fill="#c3e88d">"BS Software Engineering"</tspan><tspan fill="#d6deeb">,</tspan></text></g>
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.4s" dur="0.4s" fill="freeze"/>
      <text x="115" y="234"><tspan fill="#7fdbca">stack</tspan><tspan fill="#d6deeb">: [</tspan><tspan fill="#c3e88d">"HTML"</tspan><tspan fill="#d6deeb">, </tspan><tspan fill="#c3e88d">"CSS"</tspan><tspan fill="#d6deeb">, </tspan><tspan fill="#c3e88d">"JS"</tspan><tspan fill="#d6deeb">, </tspan><tspan fill="#c3e88d">"Node.js"</tspan><tspan fill="#d6deeb">, </tspan><tspan fill="#c3e88d">"Python"</tspan><tspan fill="#d6deeb">, </tspan><tspan fill="#c3e88d">"C#"</tspan><tspan fill="#d6deeb">],</tspan></text></g>
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.9s" dur="0.4s" fill="freeze"/>
      <text x="115" y="262"><tspan fill="#7fdbca">learning</tspan><tspan fill="#d6deeb">: [</tspan><tspan fill="#c3e88d">"React"</tspan><tspan fill="#d6deeb">, </tspan><tspan fill="#c3e88d">"Backend"</tspan><tspan fill="#d6deeb">],</tspan></text></g>
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.4s" dur="0.4s" fill="freeze"/>
      <text x="115" y="290"><tspan fill="#7fdbca">openToWork</tspan><tspan fill="#d6deeb">: </tspan><tspan fill="#f78c6c">true</tspan></text></g>
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.9s" dur="0.4s" fill="freeze"/>
      <text x="80" y="318"><tspan fill="#d6deeb">};</tspan></text></g>
    <rect x="112" y="302" width="10" height="20" fill="#c471f5" opacity="0">
      <animate attributeName="opacity" values="1;0;1" dur="1s" begin="4.4s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
